name: "P6 GHA: Setups Node"
description: "P6 GHA: Setups Node"
author: "Philip M. Gollucci"

inputs:
  node-version:
    description: "Node.js version to install (e.g., 24.14.0)"
    required: false
    default: "24.14.0"

  pnpm-version:
    description: "pnpm version to activate via Corepack (e.g., 10.28.0)"
    required: false
    default: "10.28.0"

runs:
  using: "composite"
  steps:
    - name: Install Node.js
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        # Derive the platform instead of hardcoding linux-x64, which installed
        # x64 binaries that cannot execute on arm64 runners.
        case "$(uname -s)" in
          Linux) os="linux" ;;
          Darwin) os="darwin" ;;
          *) echo "::error::Unsupported operating system: $(uname -s)" ; exit 1 ;;
        esac

        case "$(uname -m)" in
          x86_64 | amd64) arch="x64" ;;
          aarch64 | arm64) arch="arm64" ;;
          *) echo "::error::Unsupported architecture: $(uname -m)" ; exit 1 ;;
        esac

        dist="node-v${NODE_VERSION}-${os}-${arch}"
        tarball="${dist}.tar.xz"
        base_url="https://nodejs.org/dist/v${NODE_VERSION}"

        # Stage downloads outside the workspace so a consumer's checkout is
        # never written to, and a tracked file of the same name is never
        # clobbered by the download or removed by the cleanup below.
        work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/node-setup.XXXXXX")"
        trap 'rm -rf "${work}"' EXIT

        curl -fsSL "${base_url}/${tarball}" -o "${work}/${tarball}"
        curl -fsSL "${base_url}/SHASUMS256.txt" -o "${work}/SHASUMS256.txt"

        # Match the tarball's own line so an entry for a different artifact can
        # never satisfy the check.
        expected="$(awk -v want="${tarball}" '$2 == want { print $1 }' "${work}/SHASUMS256.txt")"
        if [ -z "${expected}" ]; then
          echo "::error::${tarball} is not listed in ${base_url}/SHASUMS256.txt"
          exit 1
        fi

        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "${work}/${tarball}" | awk '{ print $1 }')"
        else
          actual="$(shasum -a 256 "${work}/${tarball}" | awk '{ print $1 }')"
        fi

        if [ "${actual}" != "${expected}" ]; then
          echo "::error::Checksum mismatch for ${tarball}: expected ${expected}, got ${actual}"
          exit 1
        fi
        echo "Verified ${tarball} against ${base_url}/SHASUMS256.txt (sha256 ${expected})"

        sudo tar -xJf "${work}/${tarball}" -C /usr/local
        sudo chown -R "$(whoami)" "/usr/local/${dist}"
        echo "/usr/local/${dist}/bin" >> "$GITHUB_PATH"

    - name: Enable pnpm via Corepack
      shell: bash
      env:
        PNPM_VERSION: ${{ inputs.pnpm-version }}
      run: |
        if [[ "${ACT:-}" == "true" ]]; then
          # act runs without sudo; install shims into a writable location.
          COREPACK_BIN_DIR="${RUNNER_TEMP:-$HOME}/corepack-bin"
          mkdir -p "${COREPACK_BIN_DIR}"
          corepack enable --install-directory "${COREPACK_BIN_DIR}"
          echo "${COREPACK_BIN_DIR}" >> "$GITHUB_PATH"
          if [ -e package.json ]; then
            corepack prepare "pnpm@${PNPM_VERSION}" --activate
          fi
        else
          sudo corepack enable
          if [ -e package.json ]; then
            sudo corepack prepare "pnpm@${PNPM_VERSION}" --activate
          fi
        fi

    - name: Check Node
      shell: bash
      run: |
        set +e
        which node
        which npm
        which pnpm
        which corepack
        node -v
        npm -v
        pnpm --version || echo "pnpm not installed"
        corepack --version
        echo "$PATH"

    - name: Install pnpm and dependencies
      shell: bash
      run: |
        if [ -e package.json ]; then
          pnpm install
        fi
